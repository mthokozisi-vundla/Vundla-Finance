<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vundla Finance Tracker</title>
  </head>
  <body>
    <!--website header-->
    <header>
      <h1>Vundla Finance Tracker</h1>
    </header>

    <!--Website Navigation-->
    <nav>
      <a href="index.html">Home</a>
      <a href="#">Login</a>
      <a href="#">Register</a>
    </nav>
    <!--Main content-->
    <main>
      <!--Welcome section-->
      <section>
        <h2>Manage Your Money</h2>
        <p>Track your income, expenses and monthly budgets.</p>
      </section>
      <section>
        <h2>Create an Account</h2>

        <form>
          <div>
            <label for="full name">Full Name</label>
            <input
              type="text"
              id="full name"
              name="full_name"
              placeholder="Enter your full name"
              required
            />
          </div>

          <div>
            <label for="email">Email address</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter your email address"
              required
            />
          </div>
          <div>
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Create a password"
              required
            />
          </div>

          <button type="submit">Create Account</button>
        </form>
      </section>
    </main>

    <!--Website Footer-->
    <footer>
      <p>&copy; 2026 Vundla Finance Tracker. All rights reserved.</p>
    </footer>
  </body>
</html>
